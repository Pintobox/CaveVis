name: PintoAntiCheat
version: '${version}'
main: me.pintobox.pintoAntiCheat.PintoAntiCheat
api-version: '1.21.11'
authors: [Pintobox]
description: Server side cave visibility filtering

commands:
  cavevis:
    description: Control cave visibility and profiling
    permission: pintoanticheat.admin

permissions:
  pintoanticheat.admin:
    description: Allows access to CaveVis administration commands
    default: op