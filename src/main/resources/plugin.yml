name: CaveVis
version: '${version}'
main: me.pintobox.cavevis.CaveVisPlugin
api-version: '1.21.11'
authors: [Pintobox]
description: Server side cave visibility filtering

commands:
  cavevis:
    description: Manage CaveVis builds, profiling, and player bypasses
    permission: cavevis.admin

permissions:
  cavevis.admin:
    description: Allows access to CaveVis administration commands
    default: op